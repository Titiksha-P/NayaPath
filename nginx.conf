server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The Docker image is a zero-secret local demo. Report this explicitly
  # before the browser requests microphone access or opens a voice socket.
  location = /api/config {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"sarvamConfigured":false,"mode":"demo","message":"SARVAM_API_KEY not set. Live voice is disabled in the Docker demo."}';
  }

  location = /api/voice {
    default_type application/json;
    return 503 '{"error":"SARVAM_API_KEY not set. The Docker demo does not run the live Sarvam voice server."}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
